name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Frontend tests and build
        run: cd frontend && npm ci && npm run typecheck && npm test && npm run build
      - name: Go vet and tests
        run: go vet ./... && go test ./...
      - name: Build
        run: scripts/build.sh ci
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build
        run: scripts/build.ps1 ci
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
        continue-on-error: true # Unix-oriented tests are being ported; build and vet must pass
